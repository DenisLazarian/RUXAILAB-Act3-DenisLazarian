name: CI pipeline by DenisLazarian

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
#        continue-on-error: true
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Release Phase.
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ vars.DOCKER_USERNAME }}/mi-app:latest .
          docker push ${{ vars.DOCKER_USERNAME }}/mi-app:latest

       # Deploy Phase: Using Render Hook to deploy every change on production.
      - name: Trigger Render Deployment
        run: |
          echo "Notificando a Render para iniciar el despliegue..."
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
